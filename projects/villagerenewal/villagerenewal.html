<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading... - Ziru Wei</title>
    <link rel="icon" type="image/png" href="../../images/kitten.png">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../../styles/toc.css">
    <link rel="stylesheet" href="../../styles/markdown.css">
    <link rel="stylesheet" href="../../styles/related_matrix.css">
    <link rel="stylesheet" href="../../styles/header_footer.css">
    <script src="../../components/load_components.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script type="module" src="../../components/related_matrix.js"></script>
</head>


<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-QLERMQJ1BN"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-QLERMQJ1BN');
</script>


<body class="project-page">
    <!-- 页眉容器 -->
    <div id="header"></div>

    <!-- 项目内容 -->
    <div class="project-section">
        <div class="project-header">
            <h1 class="project-title"></h1>
            <h2 class="project-subtitle"></h2>
        </div>

        <div class="project-meta">
            <!-- 元数据将由 JavaScript 动态填充 -->
        </div>

        <div class="project-footer">
            <p class="project-context"></p>
        </div>
    </div>
        
    <!-- 视频容器 -->
    <div class="video-wrapper"></div>

    <section class="slide-viewer" data-page-count="49" tabindex="0" aria-label="Village Renewal presentation" aria-describedby="slide-help">
        <div class="slide-stage">
            <img class="slide-image" src="slides/page-01.webp" width="1120" height="630" alt="Village Renewal, slide 1 of 49">
            <button class="slide-hit-area slide-hit-previous" type="button" data-slide-step="-1" aria-label="Previous slide"></button>
            <button class="slide-hit-area slide-hit-next" type="button" data-slide-step="1" aria-label="Next slide"></button>
        </div>
        <div class="slide-controls">
            <button class="meta-link" type="button" data-slide-step="-1">Previous</button>
            <span class="slide-counter" role="status" aria-live="polite">1 / 49</span>
            <button class="meta-link" type="button" data-slide-step="1">Next</button>
            <a class="slide-pdf-link" href="ppt.pdf#page=1" target="_blank" rel="noopener noreferrer">Open slide in PDF ↗</a>
        </div>
        <p id="slide-help" class="slide-help">Click the left or right half to change slides, or focus the presentation and use the arrow keys.</p>
    </section>
    <script type="module" src="slides.js"></script>
    

    <!-- 添加 markdown 内容容器 -->
    <div id="markdown-content" class="markdown-content">
        <!-- Markdown 内容将被动态加载到这里 -->
    </div>
    
    <!-- Book page overview is inserted here by the shared project renderer. -->
    

    <!-- 页脚容器 -->
    <div id="footer"></div>


    <script type="module" src="../project_page.js"></script>
    <!-- 添加加载 markdown 的脚本 -->
    <script type="module">
        import { ProjectPage } from '../project_page.js';
        import { projects } from '../project_info.js';
        
        // 获取当前项目信息
        const projectName = ProjectPage.getCurrentProjectName();
        const currentProject = projects.find(p => p.name === projectName);
        
        // 只有当项目的 ismarkdown 为 true 时才加载 markdown 内容
        if (currentProject && currentProject.ismarkdown) {
            fetch(`${ProjectPage.getCurrentProjectName()}.md`)
                .then(response => response.text())
                .then(mdContent => {
                    // 将 markdown 转换为 HTML 并插入到容器中
                    document.getElementById('markdown-content').innerHTML = marked.parse(mdContent);
                    // 初始化目录
                    const toc = new TableOfContents();
                    toc.init();
                })
                .catch(error => {
                    console.error('Error loading markdown:', error);
                });
        }
    </script>
    <script src="../../scripts/toc.js"></script>
</body>
</html>
